[project]
name = "slm-stability-cl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "evaluate>=0.4.6",
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "peft>=0.19.1",
    "scikit-learn>=1.8.0",
    "torch>=2.7.1",
    "transformers>=5.6.2",
    "trl>=1.3.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
