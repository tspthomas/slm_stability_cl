experiment:
  name: gemma3_1b
  output_dir: outputs/gemma3_1b_cl
  results_dir: results/gemma3_1b_cl
  seed: [33, 42, 123]
  system_prompt: false

training:
  num_epochs: 1
  batch_size: 2
  max_train_batches: 10
  gradient_accumulation_steps: 8
  learning_rate: 5e-5
  max_length: 512
  gradient_checkpointing: true

eval_set_evaluation:
  enabled: true
  max_new_tokens: 256
  batch_size: 4
  #max_examples: 10

reference_set_evaluation:
  enabled: true
  max_new_tokens: 256
  batch_size: 4
  #max_examples: 10
  file: data/llm-cl-500/reference.json

stability_evaluation:
  enabled: true

model:
  name: google/gemma-3-1b-it
  trust_remote_code: true
  torch_dtype: auto

peft:
  method: lora
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules: all-linear

continual_learning:
  task_order:
    - task_1
    - task_2
    - task_3

tasks:
  task_1:
    name: fomc
    train_file: data/llm-cl-500/FOMC/train.json
    val_file: data/llm-cl-500/FOMC/eval_dev.json
    test_file: data/llm-cl-500/FOMC/test.json

  task_2:
    name: scienceqa
    train_file: data/llm-cl-500/ScienceQA/train.json
    val_file: data/llm-cl-500/ScienceQA/eval_dev.json
    test_file: data/llm-cl-500/ScienceQA/test.json

  task_3:
    name: numgluecm
    train_file: data/llm-cl-500/NumGLUE-cm/train.json
    val_file: data/llm-cl-500/NumGLUE-cm/eval_dev.json
    test_file: data/llm-cl-500/NumGLUE-cm/test.json
