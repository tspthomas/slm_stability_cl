experiment:
  name: qwen35_08b #might be generated from model name and timestamp in the future
  output_dir: outputs/qwen35_08b_cl
  results_dir: results/qwen35_08b_cl
  seed: [33, 42, 100]

model:
  name: Qwen/Qwen3.5-0.8B
  trust_remote_code: true
  torch_dtype: auto

continual_learning:
  task_order:
    - task_1
    - task_2
    - task_3

  evaluate_base_model: true
  evaluate_all_tasks_after_each_phase: true

  # R matrix convention:
  # R[0, j] = base model performance on task j
  # R[i, j] = performance on task j after training through task i
  compute_metrics:
    - final_avg_accuracy
    - bwt
    - fwt
    - avg_forgetting

tasks:
  task_1:
    name: fomc_500
    task_type: multiple_choice
    train_file: ../../data/llm-cl-500/FOMC/train.jsonl
    val_file: ../../data/llm-cl-500/FOMC/val.jsonl
    test_file: ../../data/llm-cl-500/FOMC/test.jsonl

  task_2:
    name: scienceqa_500
    task_type: multiple_choice
    train_file: ../../data/llm-cl-500/ScienceQA/train.jsonl
    val_file: ../../data/llm-cl-500/ScienceQA/val.jsonl
    test_file: ../../data/llm-cl-500/ScienceQA/test.jsonl

  task_3:
    name: numgluecm_500
    task_type: multiple_choice
    train_file: ../../data/llm-cl-500/NumGLUECM/train.jsonl
    val_file: ../../data/llm-cl-500/NumGLUECM/val.jsonl
    test_file: ../../data/llm-cl-500/NumGLUECM/test.jsonl

